name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DichTruyen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DichTruyen-apk
          path: DichTruyen.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dịch Truyện (bản mới nhất)
          body: "Tải DichTruyen.apk về điện thoại Android rồi mở để cài."
          files: DichTruyen.apk
          make_latest: true
